<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up payment
    </title>
    <link rel="stylesheet" href="1.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="big-div">
        <div class="div1">
            <h1>Welcome!</h1>
            <p class="pi">Let's Get You Started Now
                <form>
                    <div class="div-input ">
                        <input type="text" name="First name" placeholder="First name" required>
                        <i class="fa-regular fa-address-card"></i>
                    </div>
                    <div class="div-input ">
                        <input type="text" name="Last name" placeholder="Last name" required>
                        <i class="fa-regular fa-address-card"></i>
                    </div>
                    <div class="div-input">
                        <input type="email" name="email" placeholder="Your Email" max="10" min="5" required>
                        <i class="fa-regular fa-envelope"></i>
                    </div>
                    <div class="div-input">
                        <input type="password" name="Password" placeholder="Password" maxlength="20" minlength="8" required>
                        <i class="fa-regular fa-eye-slash"></i>
                    </div>
                     <div class="div-input">
                        <input type="password" name="Confirm Password" placeholder="Confirm Password" 
                     maxlength="20"                minlength="8" required>
                        <i class="fa-regular fa-eye-slash"></i>
                    </div>
                          <a class="signup" href="../payment/index.html">Sign Up</a>
                </form>
            <p class="p2">Already have an account? 
            <a href="../log.in/index.html">Log in</a> </p>
        </div>
        <div class="div2">
                <p class="p3">
                Create your <br> account and start <br>
                learning today
                </p>
        </div>
    </div>
</body>
</html>
